<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MSLSC</title>
<style>
  :root {
    --bg: #f4f7f6;
    --surface: #ffffff;
    --surface-2: #eef4f4;
    --ink: #20313a;
    --ink-soft: #5d7078;
    --ink-faint: #86999e;
    --line: #d8e2e3;
    --navy: #173F4F;
    --navy-soft: #2a5468;
    --teal: #2D7F8C;
    --gold: #f6e8a6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--navy-soft);
    display: flex;
  }

  .rail {
    width: 64px;
    background: var(--navy-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 14px 0;
    flex: 0 0 64px;
    height: 100vh;
    -webkit-app-region: drag;
  }
  .rail button {
    -webkit-app-region: no-drag;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    overflow: hidden;
    border: 0;
    padding: 0;
    cursor: pointer;
    opacity: 0.62;
    background: transparent;
    transition: opacity 0.15s, outline-color 0.15s;
    outline: 2px solid transparent;
    outline-offset: 2px;
  }
  .rail button img { display: block; width: 100%; height: 100%; }
  .rail button:hover { opacity: 0.85; }
  .rail button.active { opacity: 1; outline-color: var(--gold); }
  .rail .sep { width: 30px; height: 1px; background: rgba(255,255,255,0.18); margin: 2px 0; }

  .home {
    flex: 1 1 auto;
    background: var(--bg);
    padding: 20px 24px;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .home.hidden { display: none; }

  #hub-view {
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
  }

  /* Live audio EQ panel (system-audio loopback, reacts to the Jukebox
     / iTunes / anything playing). Network/Bluetooth/Internet status
     used to live here too, natively duplicated - that's now shown
     once, by the embedded Hub page's own Venue Signal Health card. */
  .signal-strip {
    display: flex;
    align-items: stretch;
    gap: 18px;
    background: linear-gradient(#20343d, #172830);
    border: 1px solid #0e1c22;
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 18px;
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.37), 0 4px 12px rgba(23,63,79,0.12);
    min-height: 128px;
  }
  .signal-eq { flex: 1 1 auto; min-width: 0; position: relative; align-self: stretch; }
  #eq-canvas { width: 100%; height: 100%; display: block; }
  .eq-idle {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #4a6572; font-size: 0.82rem; letter-spacing: 0.06em; text-transform: uppercase;
    pointer-events: none;
  }
  .eq-idle.hidden { display: none; }

  .loading {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
  }
  .loading.visible { display: flex; }
  .spinner {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 4px solid var(--line);
    border-top-color: var(--teal);
    animation: spin 0.8s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; border-top-color: var(--line); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading .label { font-size: 0.98rem; color: var(--ink-soft); }
  .loading .label b { color: var(--ink); }
  .loading .error-icon { font-size: 2.2rem; }
  .loading .retry {
    margin-top: 4px;
    background: var(--teal);
    color: white;
    border: 0;
    border-radius: 9px;
    padding: 10px 18px;
    font-weight: 700;
    font-size: 0.88rem;
    cursor: pointer;
  }
  .loading .retry:hover { opacity: 0.92; }
</style>
</head>
<body>
  <nav class="rail" id="rail">
    <button class="active" data-id="home" title="Home"><img src="../assets/icons/icon-hub.svg" alt="" /></button>
    <div class="sep"></div>
    <button data-id="attendance" title="Attendance"><img src="../assets/icons/icon-attendance.svg" alt="" /></button>
    <button data-id="barmenu" title="Bar Menu"><img src="../assets/icons/icon-barmenu.svg" alt="" /></button>
    <button data-id="barinventory" title="Bar Inventory"><img src="../assets/icons/icon-barinventory.svg" alt="" /></button>
    <button data-id="barbooking" title="Bar Booking"><img src="../assets/icons/icon-bar-booking.svg" alt="" /></button>
    <button data-id="nippers" title="Nippers Check-In"><img src="../assets/icons/icon-nippers.svg" alt="" /></button>
    <button data-id="foodcost" title="Food Cost Builder"><img src="../assets/icons/icon-foodcost.svg" alt="" /></button>
    <button data-id="auction" title="Auction"><img src="../assets/icons/icon-auction.svg" alt="" /></button>
    <button data-id="raffle" title="Raffle"><img src="../assets/icons/icon-raffle.svg" alt="" /></button>
    <button data-id="eventpos" title="Event POS"><img src="../assets/icons/icon-eventpos.svg" alt="" /></button>
    <button data-id="preorder" title="Meal Pre-Order"><img src="../assets/icons/icon-preorder.svg" alt="" /></button>
    <div class="sep"></div>
    <button data-id="jukebox" title="Video Jukebox (opens as its own app)"><img src="../assets/icons/icon-jukebox.png" alt="" /></button>
  </nav>

  <div class="loading" id="loading">
    <div class="spinner" id="loading-spinner"></div>
    <div class="error-icon" id="loading-error-icon" style="display:none;">⚠️</div>
    <div class="label" id="loading-label"></div>
    <button class="retry" id="loading-retry" style="display:none;">Try again</button>
  </div>

  <main class="home" id="home">
    <section class="signal-strip" id="signal-strip">
      <div class="signal-eq">
        <canvas id="eq-canvas" width="1000" height="128"></canvas>
        <div class="eq-idle" id="eq-idle">no audio playing</div>
      </div>
    </section>

    <!-- The Hub IS the command centre - this embeds its real, live page
         rather than hand-duplicating a card grid here. A new system
         built and added to the Hub just appears, no edit needed in this
         file. Clicking a card's link inside it opens that system in a
         proper view in this window (see the will-navigate handler
         below) instead of navigating this little embedded page away.
         Video Jukebox has no web page (desktop-only app) so it isn't on
         the Hub and keeps its own rail icon as the only way to launch it. -->
    <webview id="hub-view" src="https://midwaysurfhub.vercel.app/"></webview>
  </main>

  <script>
    const rail = document.getElementById('rail')
    const home = document.getElementById('home')
    const loading = document.getElementById('loading')
    const loadingSpinner = document.getElementById('loading-spinner')
    const loadingErrorIcon = document.getElementById('loading-error-icon')
    const loadingLabel = document.getElementById('loading-label')
    const loadingRetry = document.getElementById('loading-retry')
    let currentSystemId = 'home'

    function setRailHighlight(id) {
      currentSystemId = id
      // Sub-links (e.g. "attendance-kiosk") still light up their system's
      // one rail icon ("attendance") - the rail only ever shows the 6 base ids.
      const baseId = id.split('-')[0]
      for (const btn of rail.querySelectorAll('button')) {
        btn.classList.toggle('active', btn.dataset.id === baseId)
      }
      home.classList.toggle('hidden', id !== 'home')
    }

    // Ids that open as their own external app rather than a view in this
    // window - don't move the rail highlight or hide the home screen.
    const EXTERNAL_IDS = new Set(['jukebox'])

    function setActive(id) {
      if (EXTERNAL_IDS.has(id)) {
        window.mslsc.selectSystem(id)
        return
      }
      setRailHighlight(id)
      window.mslsc.selectSystem(id)
    }

    // Main process already knows to reopen the last system on launch -
    // this just keeps the rail's highlighted icon in sync with that,
    // without asking main to do it all over again.
    window.mslsc.onRestoreRailHighlight((id) => setRailHighlight(id))

    window.mslsc.onLoadingState((state) => {
      loading.classList.toggle('visible', Boolean(state.show))
      if (!state.show) return
      loadingSpinner.style.display = state.error ? 'none' : 'block'
      loadingErrorIcon.style.display = state.error ? 'block' : 'none'
      loadingRetry.style.display = state.error ? 'inline-block' : 'none'
      loadingLabel.innerHTML = state.error
        ? `Couldn't load <b>${state.label}</b> — check the connection and try again.`
        : `Loading <b>${state.label}</b>…`
    })

    loadingRetry.addEventListener('click', () => window.mslsc.retrySystem(currentSystemId))

    rail.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-id]')
      if (btn) setActive(btn.dataset.id)
    })

    // --- Embedded Hub page: the actual command centre ------------------
    // A <webview>'s own will-navigate can't be cancelled from here (only
    // a real WebContents' will-navigate can - see main.js), so this just
    // hands the guest's webContents id over once and main hooks the real
    // event on it: clicking a system's card link (a different origin,
    // e.g. midwaysurfbarmenu.vercel.app) opens as a proper view in this
    // window instead of navigating the little embedded page away.
    // Staying on the Hub's own origin is left alone.
    const hubView = document.getElementById('hub-view')
    hubView.addEventListener('dom-ready', () => {
      window.mslsc.registerHubWebContents(hubView.getWebContentsId())
    }, { once: true })

    // Every card on the Hub opens its link with target="_blank" (so a
    // plain browser tab gets a real new tab) - inside a <webview> that
    // doesn't navigate the guest at all, it fires 'new-window' instead
    // of 'will-navigate', which nothing here was listening for. With no
    // handler, Electron's default for an unhandled webview new-window
    // request is to do nothing at all - not open a window, not error,
    // just silently drop the click. That's the "Dashboard button does
    // nothing" bug (2026-09-02) - and every other Hub link had the exact
    // same problem, not just Dashboard, since they're all target="_blank".
    // Unlike will-navigate, new-window IS directly listenable (and
    // preventable) on the <webview> element itself, no main-process
    // relay needed - routes through the same openUrl/showSystem path
    // will-navigate already uses, so it opens as a proper view in this
    // window exactly the same way.
    hubView.addEventListener('new-window', (event) => {
      window.mslsc.openUrl(event.url)
    })

    // --- Live audio EQ (system-audio loopback) ---------------------
    // Captures the PC's audio output mix - reacts to whatever is
    // playing (the Video Jukebox, iTunes, a browser tab, anything).
    // Electron's main process grants this via setDisplayMediaRequestHandler
    // with audio:'loopback', so there's no picker / no permission prompt.
    const eqCanvas = document.getElementById('eq-canvas')
    const eqIdle = document.getElementById('eq-idle')
    const eqCtx = eqCanvas.getContext('2d')
    const EQ_BARS = 44
    let eqAnalyser = null
    let eqData = null
    let eqSilentFrames = 0

    function drawEqFrame() {
      requestAnimationFrame(drawEqFrame)
      const W = eqCanvas.width, H = eqCanvas.height
      // Skip work while the home screen is hidden (a system view is open).
      if (eqCanvas.offsetParent === null) return
      eqCtx.clearRect(0, 0, W, H)

      const base = Math.round(H * 0.66)
      const gap = 3
      const bw = (W - gap * (EQ_BARS - 1)) / EQ_BARS
      let peak = 0

      if (eqAnalyser) eqAnalyser.getByteFrequencyData(eqData)

      for (let i = 0; i < EQ_BARS; i++) {
        let v = 0
        if (eqAnalyser) {
          // log-ish mapping so bass doesn't hog the left; use the lower
          // ~65% of bins (the musical range).
          const lo = Math.floor(Math.pow(i / EQ_BARS, 1.8) * eqData.length * 0.62)
          const hi = Math.max(lo + 1, Math.floor(Math.pow((i + 1) / EQ_BARS, 1.8) * eqData.length * 0.62))
          let s = 0
          for (let b = lo; b < hi; b++) s = Math.max(s, eqData[b])
          v = s / 255
        }
        if (v > peak) peak = v
        const bh = Math.max(2, v * base * 0.94)
        const x = i * (bw + gap)

        const grad = eqCtx.createLinearGradient(0, base, 0, 0)
        grad.addColorStop(0, '#3fae6d')
        grad.addColorStop(0.55, '#e0a53a')
        grad.addColorStop(1, '#e34b3a')
        eqCtx.fillStyle = grad
        eqCtx.fillRect(x, base - bh, bw, bh)

        // reflection
        const rg = eqCtx.createLinearGradient(0, base, 0, H)
        rg.addColorStop(0, 'rgba(120,180,150,0.30)')
        rg.addColorStop(1, 'rgba(120,180,150,0)')
        eqCtx.fillStyle = rg
        eqCtx.fillRect(x, base, bw, Math.min(bh * 0.6, H - base))
      }

      if (peak < 0.02) eqSilentFrames++
      else eqSilentFrames = 0
      eqIdle.classList.toggle('hidden', !eqAnalyser || eqSilentFrames < 60)
    }

    async function startAudioCapture() {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true })
        stream.getVideoTracks().forEach((t) => t.stop())
        const audioTracks = stream.getAudioTracks()
        if (!audioTracks.length) throw new Error('no audio track')
        const actx = new (window.AudioContext || window.webkitAudioContext)()
        const src = actx.createMediaStreamSource(new MediaStream(audioTracks))
        const an = actx.createAnalyser()
        an.fftSize = 1024
        an.smoothingTimeConstant = 0.78
        const sink = actx.createGain()
        sink.gain.value = 0
        src.connect(an); an.connect(sink); sink.connect(actx.destination)
        if (actx.state === 'suspended') actx.resume()
        eqAnalyser = an
        eqData = new Uint8Array(an.frequencyBinCount)
        eqIdle.textContent = 'no audio playing'
      } catch (e) {
        eqAnalyser = null
        eqIdle.textContent = 'audio meter unavailable'
        eqIdle.classList.remove('hidden')
      }
    }

    drawEqFrame()
    startAudioCapture()
    // Retry: a few seconds in (handler not ready), and once on the first
    // user interaction (some Chromium builds still want a gesture).
    setTimeout(() => { if (!eqAnalyser) startAudioCapture() }, 5000)
    window.addEventListener('pointerdown', function once() {
      window.removeEventListener('pointerdown', once)
      if (!eqAnalyser) startAudioCapture()
    })
  </script>
</body>
</html>
