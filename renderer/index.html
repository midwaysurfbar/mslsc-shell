<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MSLSC</title>
<style>
  :root {
    --bg: #f4f7f6;
    --surface: #ffffff;
    --surface-2: #eef4f4;
    --ink: #20313a;
    --ink-soft: #5d7078;
    --ink-faint: #86999e;
    --line: #d8e2e3;
    --navy: #173F4F;
    --navy-soft: #2a5468;
    --teal: #2D7F8C;
    --gold: #f6e8a6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--navy-soft);
    display: flex;
  }

  .rail {
    width: 64px;
    background: var(--navy-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 14px 0;
    flex: 0 0 64px;
    height: 100vh;
    -webkit-app-region: drag;
  }
  .rail button {
    -webkit-app-region: no-drag;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    overflow: hidden;
    border: 0;
    padding: 0;
    cursor: pointer;
    opacity: 0.62;
    background: transparent;
    transition: opacity 0.15s, outline-color 0.15s;
    outline: 2px solid transparent;
    outline-offset: 2px;
  }
  .rail button img { display: block; width: 100%; height: 100%; }
  .rail button:hover { opacity: 0.85; }
  .rail button.active { opacity: 1; outline-color: var(--gold); }
  .rail .sep { width: 30px; height: 1px; background: rgba(255,255,255,0.18); margin: 2px 0; }

  .home {
    flex: 1 1 auto;
    background: var(--bg);
    padding: 20px 24px;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .home.hidden { display: none; }

  #hub-view {
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
  }

  /* Venue dashboard strip - always visible on the home screen. A live
     audio EQ (system-audio loopback, reacts to the Jukebox / iTunes /
     anything playing) as the centrepiece, with the venue network and
     Bluetooth signal read-outs to the side (polled from the Hub's
     venue-signal function). */
  .signal-strip {
    display: flex;
    align-items: stretch;
    gap: 18px;
    background: linear-gradient(#20343d, #172830);
    border: 1px solid #0e1c22;
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 18px;
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.37), 0 4px 12px rgba(23,63,79,0.12);
    min-height: 128px;
  }
  .signal-side {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
    flex: 0 0 auto;
    width: 210px;
  }
  .signal-part { display: flex; align-items: center; gap: 10px; }
  .signal-gauge { width: 70px; height: auto; flex: 0 0 auto; }
  .signal-bars { width: 48px; height: auto; flex: 0 0 auto; }
  .signal-lamp { width: 34px; height: auto; flex: 0 0 auto; }
  .signal-text { min-width: 0; }
  .signal-text .signal-primary { font-weight: 800; color: #f6e8a6; font-size: 0.92rem; line-height: 1.15; }
  .signal-text .signal-secondary { font-size: 0.72rem; color: #a9c2c8; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .signal-eq { flex: 1 1 auto; min-width: 0; position: relative; align-self: stretch; }
  #eq-canvas { width: 100%; height: 100%; display: block; }
  .eq-idle {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #4a6572; font-size: 0.82rem; letter-spacing: 0.06em; text-transform: uppercase;
    pointer-events: none;
  }
  .eq-idle.hidden { display: none; }

  .signal-status {
    align-self: center;
    font-size: 0.76rem;
    font-weight: 750;
    padding: 5px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    color: #a9c2c8;
    white-space: nowrap;
    flex: 0 0 auto;
  }
  .signal-status.live { color: #7ee0a8; background: rgba(63,174,109,0.16); }
  .signal-status.stale { color: #e8c07a; background: rgba(224,165,58,0.16); }
  .signal-status.offline { color: #f0a0a0; background: rgba(192,57,43,0.18); }
  .sig-g-zone { fill: none; stroke-width: 8; }
  .sig-g-needle { stroke: #f4ecd8; stroke-width: 3; stroke-linecap: round; transition: all 0.5s cubic-bezier(.34,1.3,.5,1); }
  .sig-g-hub { fill: #f4ecd8; }
  .sig-b-on { fill: #4fc3d6; }
  .sig-b-off { fill: #33474f; }
  .sig-lamp-ring { fill: none; stroke: #0e1c22; stroke-width: 3; }
  .sig-lamp-core { stroke: #0e1c22; stroke-width: 1; transition: fill 0.3s ease; }
  .sig-lamp-core.high { fill: #3fae6d; }
  .sig-lamp-core.mid { fill: #e0a53a; }
  .sig-lamp-core.low, .sig-lamp-core.off { fill: #c0392b; }
  .signal-strip.dim .sig-g-zone { stroke: #4a5b62 !important; }
  .signal-strip.dim .sig-g-needle { stroke: #6b7c83; }
  .signal-strip.dim .sig-b-on { fill: #5a6f76; }
  .signal-strip.dim .sig-lamp-core { fill: #4a5b62 !important; }

  @media (max-width: 720px) {
    .signal-strip { flex-wrap: wrap; }
    .signal-side { width: auto; flex-direction: row; }
    .signal-eq { flex-basis: 100%; min-height: 90px; }
  }

  .loading {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
  }
  .loading.visible { display: flex; }
  .spinner {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 4px solid var(--line);
    border-top-color: var(--teal);
    animation: spin 0.8s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; border-top-color: var(--line); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading .label { font-size: 0.98rem; color: var(--ink-soft); }
  .loading .label b { color: var(--ink); }
  .loading .error-icon { font-size: 2.2rem; }
  .loading .retry {
    margin-top: 4px;
    background: var(--teal);
    color: white;
    border: 0;
    border-radius: 9px;
    padding: 10px 18px;
    font-weight: 700;
    font-size: 0.88rem;
    cursor: pointer;
  }
  .loading .retry:hover { opacity: 0.92; }
</style>
</head>
<body>
  <nav class="rail" id="rail">
    <button class="active" data-id="home" title="Home"><img src="../assets/icons/icon-hub.svg" alt="" /></button>
    <div class="sep"></div>
    <button data-id="attendance" title="Attendance"><img src="../assets/icons/icon-attendance.svg" alt="" /></button>
    <button data-id="barmenu" title="Bar Menu"><img src="../assets/icons/icon-barmenu.svg" alt="" /></button>
    <button data-id="barinventory" title="Bar Inventory"><img src="../assets/icons/icon-barinventory.svg" alt="" /></button>
    <button data-id="barbooking" title="Bar Booking"><img src="../assets/icons/icon-bar-booking.svg" alt="" /></button>
    <button data-id="nippers" title="Nippers Check-In"><img src="../assets/icons/icon-nippers.svg" alt="" /></button>
    <button data-id="foodcost" title="Food Cost Builder"><img src="../assets/icons/icon-foodcost.svg" alt="" /></button>
    <button data-id="auction" title="Auction"><img src="../assets/icons/icon-auction.svg" alt="" /></button>
    <button data-id="raffle" title="Raffle"><img src="../assets/icons/icon-raffle.svg" alt="" /></button>
    <button data-id="eventpos" title="Event POS"><img src="../assets/icons/icon-eventpos.svg" alt="" /></button>
    <button data-id="preorder" title="Meal Pre-Order"><img src="../assets/icons/icon-preorder.svg" alt="" /></button>
    <div class="sep"></div>
    <button data-id="jukebox" title="Video Jukebox (opens as its own app)"><img src="../assets/icons/icon-jukebox.png" alt="" /></button>
  </nav>

  <div class="loading" id="loading">
    <div class="spinner" id="loading-spinner"></div>
    <div class="error-icon" id="loading-error-icon" style="display:none;">⚠️</div>
    <div class="label" id="loading-label"></div>
    <button class="retry" id="loading-retry" style="display:none;">Try again</button>
  </div>

  <main class="home" id="home">
    <section class="signal-strip" id="signal-strip">
      <div class="signal-side">
        <div class="signal-part">
          <svg class="signal-gauge" id="sig-gauge" viewBox="0 0 120 74" aria-hidden="true"></svg>
          <div class="signal-text">
            <div class="signal-primary" id="sig-wifi-primary">Network —</div>
            <div class="signal-secondary" id="sig-wifi-secondary">venue PC</div>
          </div>
        </div>
        <div class="signal-part">
          <svg class="signal-lamp" id="sig-lamp" viewBox="0 0 40 40" aria-hidden="true"></svg>
          <div class="signal-text">
            <div class="signal-primary" id="sig-net-primary">Internet —</div>
            <div class="signal-secondary" id="sig-net-secondary">&nbsp;</div>
          </div>
        </div>
        <div class="signal-part">
          <svg class="signal-bars" id="sig-bars" viewBox="0 0 92 56" aria-hidden="true"></svg>
          <div class="signal-text">
            <div class="signal-primary" id="sig-bt-primary">Bluetooth —</div>
            <div class="signal-secondary" id="sig-bt-secondary">&nbsp;</div>
          </div>
        </div>
      </div>
      <div class="signal-eq">
        <canvas id="eq-canvas" width="1000" height="128"></canvas>
        <div class="eq-idle" id="eq-idle">no audio playing</div>
      </div>
      <div class="signal-status" id="sig-status">Connecting…</div>
    </section>

    <!-- The Hub IS the command centre - this embeds its real, live page
         rather than hand-duplicating a card grid here. A new system
         built and added to the Hub just appears, no edit needed in this
         file. Clicking a card's link inside it opens that system in a
         proper view in this window (see the will-navigate handler
         below) instead of navigating this little embedded page away.
         Video Jukebox has no web page (desktop-only app) so it isn't on
         the Hub and keeps its own rail icon as the only way to launch it. -->
    <webview id="hub-view" src="https://midwaysurfhub.vercel.app/"></webview>
  </main>

  <script>
    const rail = document.getElementById('rail')
    const home = document.getElementById('home')
    const loading = document.getElementById('loading')
    const loadingSpinner = document.getElementById('loading-spinner')
    const loadingErrorIcon = document.getElementById('loading-error-icon')
    const loadingLabel = document.getElementById('loading-label')
    const loadingRetry = document.getElementById('loading-retry')
    let currentSystemId = 'home'

    function setRailHighlight(id) {
      currentSystemId = id
      // Sub-links (e.g. "attendance-kiosk") still light up their system's
      // one rail icon ("attendance") - the rail only ever shows the 6 base ids.
      const baseId = id.split('-')[0]
      for (const btn of rail.querySelectorAll('button')) {
        btn.classList.toggle('active', btn.dataset.id === baseId)
      }
      home.classList.toggle('hidden', id !== 'home')
    }

    // Ids that open as their own external app rather than a view in this
    // window - don't move the rail highlight or hide the home screen.
    const EXTERNAL_IDS = new Set(['jukebox'])

    function setActive(id) {
      if (EXTERNAL_IDS.has(id)) {
        window.mslsc.selectSystem(id)
        return
      }
      setRailHighlight(id)
      window.mslsc.selectSystem(id)
    }

    // Main process already knows to reopen the last system on launch -
    // this just keeps the rail's highlighted icon in sync with that,
    // without asking main to do it all over again.
    window.mslsc.onRestoreRailHighlight((id) => setRailHighlight(id))

    window.mslsc.onLoadingState((state) => {
      loading.classList.toggle('visible', Boolean(state.show))
      if (!state.show) return
      loadingSpinner.style.display = state.error ? 'none' : 'block'
      loadingErrorIcon.style.display = state.error ? 'block' : 'none'
      loadingRetry.style.display = state.error ? 'inline-block' : 'none'
      loadingLabel.innerHTML = state.error
        ? `Couldn't load <b>${state.label}</b> — check the connection and try again.`
        : `Loading <b>${state.label}</b>…`
    })

    loadingRetry.addEventListener('click', () => window.mslsc.retrySystem(currentSystemId))

    rail.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-id]')
      if (btn) setActive(btn.dataset.id)
    })

    // --- Embedded Hub page: the actual command centre ------------------
    // A <webview>'s own will-navigate can't be cancelled from here (only
    // a real WebContents' will-navigate can - see main.js), so this just
    // hands the guest's webContents id over once and main hooks the real
    // event on it: clicking a system's card link (a different origin,
    // e.g. midwaysurfbarmenu.vercel.app) opens as a proper view in this
    // window instead of navigating the little embedded page away.
    // Staying on the Hub's own origin is left alone.
    const hubView = document.getElementById('hub-view')
    hubView.addEventListener('dom-ready', () => {
      window.mslsc.registerHubWebContents(hubView.getWebContentsId())
    }, { once: true })

    // --- Live venue network / Bluetooth signal strip -------------------
    const SIGNAL_URL = 'https://zzfcadiphconmkeudrby.supabase.co/functions/v1/venue-signal'
    const SIGNAL_ANON = 'sb_publishable_IDOXZicxdptjL667yWpVAQ_H1jB2saj'
    const SIG_FRESH_MS = 150000
    const SIG_OFFLINE_MS = 15 * 60 * 1000

    const NS = 'http://www.w3.org/2000/svg'
    const G_CX = 60, G_CY = 62, G_R = 46

    function gPolar(pct, r) {
      const a = Math.PI - (Math.max(0, Math.min(100, pct)) / 100) * Math.PI
      return [G_CX + r * Math.cos(a), G_CY - r * Math.sin(a)]
    }
    function gArc(p0, p1, r) {
      const [x0, y0] = gPolar(p0, r), [x1, y1] = gPolar(p1, r)
      return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`
    }
    function el(tag, attrs) {
      const n = document.createElementNS(NS, tag)
      for (const k in attrs) n.setAttribute(k, attrs[k])
      return n
    }

    function drawGauge(pct) {
      const g = document.getElementById('sig-gauge')
      g.innerHTML = ''
      const zones = [[0, 30, '#c0392b'], [30, 55, '#e0a53a'], [55, 100, '#3fae6d']]
      for (const [a, b, c] of zones) g.appendChild(el('path', { d: gArc(a, b, G_R), class: 'sig-g-zone', stroke: c }))
      const v = pct == null ? 0 : pct
      const [nx, ny] = gPolar(v, G_R - 10)
      const [tx, ty] = gPolar(v, -6)
      g.appendChild(el('line', { x1: tx, y1: ty, x2: nx, y2: ny, class: 'sig-g-needle' }))
      g.appendChild(el('circle', { cx: G_CX, cy: G_CY, r: 5, class: 'sig-g-hub' }))
    }

    function rssiToBars(rssi) {
      if (rssi == null) return 0
      if (rssi >= -58) return 5
      if (rssi >= -66) return 4
      if (rssi >= -74) return 3
      if (rssi >= -82) return 2
      if (rssi >= -90) return 1
      return 0
    }

    function drawBars(bars, powered) {
      const s = document.getElementById('sig-bars')
      s.innerHTML = ''
      for (let i = 0; i < 5; i++) {
        const h = 12 + i * 9
        const on = bars != null ? i < bars : powered
        s.appendChild(el('rect', { x: 2 + i * 12, y: 50 - h, width: 8, height: h, rx: 2, class: on ? 'sig-b-on' : 'sig-b-off' }))
      }
    }

    function drawLamp(online, pct) {
      const l = document.getElementById('sig-lamp')
      l.innerHTML = ''
      const tier = !online ? 'off' : pct >= 70 ? 'high' : pct >= 30 ? 'mid' : 'low'
      l.appendChild(el('circle', { cx: 20, cy: 20, r: 16, class: 'sig-lamp-ring' }))
      l.appendChild(el('circle', { cx: 20, cy: 20, r: 11, class: 'sig-lamp-core ' + tier }))
    }

    function relAge(ms) {
      const m = Math.round(ms / 60000)
      if (m < 1) return 'just now'
      if (m < 60) return m + ' min ago'
      const h = Math.round(m / 60)
      return h + (h === 1 ? ' hour ago' : ' hours ago')
    }

    function renderSignal(reading, serverTime) {
      const strip = document.getElementById('signal-strip')
      const statusEl = document.getElementById('sig-status')
      const wp = document.getElementById('sig-wifi-primary')
      const ws = document.getElementById('sig-wifi-secondary')
      const np = document.getElementById('sig-net-primary')
      const ns = document.getElementById('sig-net-secondary')
      const bp = document.getElementById('sig-bt-primary')
      const bs = document.getElementById('sig-bt-secondary')

      if (!reading) {
        strip.classList.add('dim')
        statusEl.className = 'signal-status offline'
        statusEl.textContent = 'No readings yet'
        drawGauge(null); drawLamp(false, 0); drawBars(null, false)
        wp.textContent = 'Network —'; ws.textContent = 'venue PC'
        np.textContent = 'Internet —'; ns.innerHTML = '&nbsp;'
        bp.textContent = 'Bluetooth —'; bs.innerHTML = '&nbsp;'
        return
      }

      const now = serverTime ? new Date(serverTime).getTime() : Date.now()
      const rec = reading.recorded_at ? new Date(reading.recorded_at).getTime() : null
      const age = rec != null ? Math.max(0, now - rec) : null
      const offline = age == null || age >= SIG_OFFLINE_MS
      const stale = !offline && age > SIG_FRESH_MS
      strip.classList.toggle('dim', offline || stale)

      statusEl.className = 'signal-status ' + (offline ? 'offline' : stale ? 'stale' : 'live')
      statusEl.textContent = offline
        ? 'Venue PC offline'
        : stale
          ? 'Last seen ' + (age != null ? relAge(age) : 'a while ago')
          : 'Live'

      const show = !offline
      // Connection (Wi-Fi or wired) - the venue PC moved to a wired
      // connection 2026-08-30; connection_type (set by the agent) picks
      // whichever is actually carrying traffic, so this falls back to a
      // Wi-Fi reading on its own if it's ever wireless again.
      const connType = reading.connection_type || (reading.wired_online ? 'wired' : reading.wifi_online ? 'wifi' : null)
      const isWired = connType === 'wired'
      const connLabel = isWired ? 'Ethernet' : 'Wi-Fi'
      const sig = show ? (isWired ? reading.wired_signal : reading.wifi_signal) : null
      const connOnline = isWired ? reading.wired_online : reading.wifi_online
      drawGauge(sig)
      if (show && connOnline) {
        wp.textContent = connLabel + ' ' + (sig != null ? sig + '%' : '—')
        const bits = isWired
          ? [
              reading.wired_rate_mbps ? Math.round(reading.wired_rate_mbps) + ' Mbps' : null,
              reading.net_latency_ms_wired != null ? reading.net_latency_ms_wired + ' ms' : null,
            ]
          : [reading.wifi_ssid]
        if (!isWired) {
          if (reading.wifi_signal_source === 'derived') {
            if (reading.wifi_rate_mbps) bits.push(Math.round(reading.wifi_rate_mbps) + ' Mbps')
            if (reading.net_latency_ms != null) bits.push(reading.net_latency_ms + ' ms')
          } else if (reading.wifi_dbm != null) {
            bits.push(reading.wifi_dbm + ' dBm')
          }
        }
        ws.textContent = bits.filter(Boolean).join(' · ')
      } else {
        wp.textContent = connLabel + ' —'
        ws.textContent = show ? 'not connected' : 'no reading'
      }

      // Internet - a real end-to-end reachability check (pings an
      // actual internet host), independent of the local wired/Wi-Fi hop
      // above. Catches a degraded Wi-Fi extender/mesh backhaul that the
      // local-hop reading alone can't see (it can show 100% while the
      // extender's own wireless link back to the router is struggling).
      const netOnline = show && reading.internet_online
      const netPct = reading.internet_signal || 0
      drawLamp(netOnline, netPct)
      if (show) {
        np.textContent = 'Internet ' + (reading.internet_online ? netPct + '%' : 'offline')
        ns.textContent = reading.internet_online
          ? [
              reading.internet_latency_ms != null ? reading.internet_latency_ms + ' ms' : null,
              reading.internet_loss_pct ? reading.internet_loss_pct + '% loss' : null,
            ].filter(Boolean).join(' · ')
          : 'no response'
      } else {
        np.textContent = 'Internet —'
        ns.textContent = 'no reading'
      }

      // Bluetooth / sound system
      const tName = reading.bt_target_name || null
      const tConn = reading.bt_target_connected
      const tRssi = reading.bt_target_rssi
      const btBad = reading.bt_scan_error ? 'Bluetooth unavailable' : 'radio off'
      if (tName) {
        bp.textContent = 'Sound System'
        if (show && tConn) {
          drawBars(tRssi != null ? rssiToBars(tRssi) : null, true)
          bs.textContent = (reading.bt_target_audio ? 'audio playing' : 'connected') + (tRssi != null ? ' · ' + tRssi + ' dBm' : '')
        } else if (show && reading.bt_powered) {
          drawBars(0, false)
          bs.textContent = 'not connected'
        } else {
          drawBars(0, false)
          bs.textContent = show ? btBad : 'no reading'
        }
      } else {
        drawBars(null, show && reading.bt_powered)
        const n = reading.bt_devices_seen
        if (show && !reading.bt_powered) {
          bp.textContent = 'Bluetooth'
          bs.textContent = btBad
        } else {
          bp.textContent = 'Bluetooth ' + (show ? 'on' : '—')
          bs.textContent = show && n != null ? n + ' nearby' : ' '
        }
      }
    }

    async function loadSignal() {
      try {
        const res = await fetch(SIGNAL_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': SIGNAL_ANON, 'Authorization': 'Bearer ' + SIGNAL_ANON },
          body: JSON.stringify({ action: 'latest', site: 'venue' }),
        })
        const data = await res.json()
        if (data && data.ok) renderSignal(data.reading, data.serverTime)
      } catch {
        // leave whatever's on screen; the status pill will age into "offline"
      }
    }
    drawGauge(null); drawLamp(false, 0); drawBars(null, false)
    loadSignal()
    setInterval(loadSignal, 20000)

    // --- Live audio EQ (system-audio loopback) ---------------------
    // Captures the PC's audio output mix - reacts to whatever is
    // playing (the Video Jukebox, iTunes, a browser tab, anything).
    // Electron's main process grants this via setDisplayMediaRequestHandler
    // with audio:'loopback', so there's no picker / no permission prompt.
    const eqCanvas = document.getElementById('eq-canvas')
    const eqIdle = document.getElementById('eq-idle')
    const eqCtx = eqCanvas.getContext('2d')
    const EQ_BARS = 44
    let eqAnalyser = null
    let eqData = null
    let eqSilentFrames = 0

    function drawEqFrame() {
      requestAnimationFrame(drawEqFrame)
      const W = eqCanvas.width, H = eqCanvas.height
      // Skip work while the home screen is hidden (a system view is open).
      if (eqCanvas.offsetParent === null) return
      eqCtx.clearRect(0, 0, W, H)

      const base = Math.round(H * 0.66)
      const gap = 3
      const bw = (W - gap * (EQ_BARS - 1)) / EQ_BARS
      let peak = 0

      if (eqAnalyser) eqAnalyser.getByteFrequencyData(eqData)

      for (let i = 0; i < EQ_BARS; i++) {
        let v = 0
        if (eqAnalyser) {
          // log-ish mapping so bass doesn't hog the left; use the lower
          // ~65% of bins (the musical range).
          const lo = Math.floor(Math.pow(i / EQ_BARS, 1.8) * eqData.length * 0.62)
          const hi = Math.max(lo + 1, Math.floor(Math.pow((i + 1) / EQ_BARS, 1.8) * eqData.length * 0.62))
          let s = 0
          for (let b = lo; b < hi; b++) s = Math.max(s, eqData[b])
          v = s / 255
        }
        if (v > peak) peak = v
        const bh = Math.max(2, v * base * 0.94)
        const x = i * (bw + gap)

        const grad = eqCtx.createLinearGradient(0, base, 0, 0)
        grad.addColorStop(0, '#3fae6d')
        grad.addColorStop(0.55, '#e0a53a')
        grad.addColorStop(1, '#e34b3a')
        eqCtx.fillStyle = grad
        eqCtx.fillRect(x, base - bh, bw, bh)

        // reflection
        const rg = eqCtx.createLinearGradient(0, base, 0, H)
        rg.addColorStop(0, 'rgba(120,180,150,0.30)')
        rg.addColorStop(1, 'rgba(120,180,150,0)')
        eqCtx.fillStyle = rg
        eqCtx.fillRect(x, base, bw, Math.min(bh * 0.6, H - base))
      }

      if (peak < 0.02) eqSilentFrames++
      else eqSilentFrames = 0
      eqIdle.classList.toggle('hidden', !eqAnalyser || eqSilentFrames < 60)
    }

    async function startAudioCapture() {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true })
        stream.getVideoTracks().forEach((t) => t.stop())
        const audioTracks = stream.getAudioTracks()
        if (!audioTracks.length) throw new Error('no audio track')
        const actx = new (window.AudioContext || window.webkitAudioContext)()
        const src = actx.createMediaStreamSource(new MediaStream(audioTracks))
        const an = actx.createAnalyser()
        an.fftSize = 1024
        an.smoothingTimeConstant = 0.78
        const sink = actx.createGain()
        sink.gain.value = 0
        src.connect(an); an.connect(sink); sink.connect(actx.destination)
        if (actx.state === 'suspended') actx.resume()
        eqAnalyser = an
        eqData = new Uint8Array(an.frequencyBinCount)
        eqIdle.textContent = 'no audio playing'
      } catch (e) {
        eqAnalyser = null
        eqIdle.textContent = 'audio meter unavailable'
        eqIdle.classList.remove('hidden')
      }
    }

    drawEqFrame()
    startAudioCapture()
    // Retry: a few seconds in (handler not ready), and once on the first
    // user interaction (some Chromium builds still want a gesture).
    setTimeout(() => { if (!eqAnalyser) startAudioCapture() }, 5000)
    window.addEventListener('pointerdown', function once() {
      window.removeEventListener('pointerdown', once)
      if (!eqAnalyser) startAudioCapture()
    })
  </script>
</body>
</html>
