name: Build Windows installer

# Manual trigger only - this isn't meant to run on every push, just
# whenever a real Windows installer build is actually wanted. Runs on
# GitHub's own Windows runner, so electron-builder's NSIS step (which
# needs Windows tooling that only works reliably via wine on Linux)
# just works natively - no wine, no cross-compilation tricks.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: MSLSC-Windows-Installer
          path: release/*.exe
          retention-days: 30
